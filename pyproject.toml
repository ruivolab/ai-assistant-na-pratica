[project]
name = "ai-assistant-na-pratica"
version = "0.1.0"
description = "Código do livro AI Assistant na Prática: o assistente de uma loja de café, com skills, MCP e limites."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.115",
    "fastmcp>=4.1,<5",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
store-mcp = "assistant.store.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
